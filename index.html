<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Доброй ночи</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Marck+Script&display=swap"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <main class="scene">
        <h1 class="title">Доброй ночи, Арина</h1>

        <div class="moon" id="moon" role="button" tabindex="0" aria-label="Нажми на месяц">
            <div class="moon-glow" aria-hidden="true"></div>

            <!-- Месяц -->
            <svg class="moon-svg moon-svg--moon" viewBox="0 0 200 200" aria-hidden="true">
                <defs>
                    <radialGradient id="moonGrad" cx="35%" cy="30%" r="75%">
                        <stop offset="0%" stop-color="#fffce8" />
                        <stop offset="55%" stop-color="#f8ecc0" />
                        <stop offset="100%" stop-color="#e6cf85" />
                    </radialGradient>
                    <mask id="crescentMask">
                        <rect width="200" height="200" fill="black" />
                        <circle cx="100" cy="100" r="72" fill="white" />
                        <circle cx="138" cy="100" r="64" fill="black" />
                    </mask>
                </defs>
                <circle cx="100" cy="100" r="72" fill="url(#moonGrad)" mask="url(#crescentMask)" />
            </svg>

            <!-- Сердце (появляется после 812 кликов) -->
            <svg class="moon-svg moon-svg--heart" viewBox="0 0 200 200" aria-hidden="true">
                <defs>
                    <radialGradient id="heartGrad" cx="35%" cy="30%" r="75%">
                        <stop offset="0%" stop-color="#ffc8d6" />
                        <stop offset="55%" stop-color="#ff6b8a" />
                        <stop offset="100%" stop-color="#c9184a" />
                    </radialGradient>
                </defs>
                <path
                    d="M100,176 C40,128 8,90 8,58 C8,30 30,8 58,8 C78,8 92,20 100,38 C108,20 122,8 142,8 C170,8 192,30 192,58 C192,90 160,128 100,176 Z"
                    fill="url(#heartGrad)"
                />
            </svg>
        </div>

        <div class="bottom-text">
            <p class="subtitle">Самых сладких снов</p>
            <div class="continue-hint" id="continueHint" aria-live="polite"></div>
        </div>
    </main>

    <div class="click-counter" id="clickCounter" aria-label="Счётчик кликов">0</div>

    <script src="stars.js" defer></script>
</body>
</html>
